<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Delta Spritesheet BETA · PixiJS 8</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c1119;color:#e3edf2;font:14px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:21px}small{color:#aac36a}button,select,input{font:inherit;padding:8px;background:#22303e;color:inherit;border:1px solid #3e5264;border-radius:6px}button{cursor:pointer}header,.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}#view{height:65vh;min-height:250px;border:1px solid #3e5264;border-radius:12px;overflow:hidden;background:repeating-conic-gradient(#29313b 0 25%,#1a222c 0 50%) 0/24px 24px}canvas{display:block;width:100%;height:100%}#scrub{flex:1;min-width:160px}#status{white-space:pre-wrap;color:#b7c6d3;line-height:1.6}label{display:inline-flex;gap:6px;align-items:center}</style>
<main><h1>Delta Spritesheet <small>BETA · PixiJS 8.22.0</small></h1><header><label>Exported folder <input id="folder" type="file" webkitdirectory multiple></label><select id="backend"><option value="webgl">WebGL2</option><option value="webgpu">WebGPU</option></select><span>Offline preview · RGBA replacement</span></header><div id="view"></div><div class="controls" style="margin-top:14px"><button id="previous">│◀</button><button id="play">Play</button><button id="next">▶│</button><input id="scrub" type="range" min="0" max="0" value="0"><span id="time">0 / 0</span><label><input id="loop" type="checkbox" checked>Loop</label><select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select><select id="background"><option value="checker">Checkerboard</option><option value="#ffffff">White</option><option value="#000000">Black</option><option value="#ff00ff">Magenta</option></select><label><input id="regions" type="checkbox">Changed regions</label></div><p id="status">Select the exported folder containing delta.animation.json. No server or Internet connection is required.</p></main>
<script src="vendor/pixi.min.js"></script><script src="delta-runtime.iife.js"></script><script>
const $=id=>document.getElementById(id);let app,asset,player,overlay,files,lastFrame=-1;
const status=message=>$('status').textContent=message;
function qualitySummary(r){const measured=`max error ${r.maximumVisibleError??0}/255 · mean ${(r.meanVisibleError??0).toFixed(3)}/255`;return r.textureFormat==='webp'?`WebP ${r.textureQuality}/100 · patch tolerance ${r.tolerance}/255 · ${measured}`:r.tolerance?`Approximate · tolerance ${r.tolerance}/255 · ${measured}`:'Exact RGBA';}
function fit(){if(!app||!player)return;const m=asset.manifest,s=Math.min(app.screen.width/m.width,app.screen.height/m.height);player.sprite.scale.set(s);player.sprite.position.set((app.screen.width-m.width*s)/2,(app.screen.height-m.height*s)/2);overlay.position.copyFrom(player.sprite.position);overlay.scale.set(s);}
function refresh(){if(!player)return;$('scrub').value=player.currentFrame;$('time').textContent=`${player.currentFrame+1} / ${asset.manifest.frames.length}`;$('play').textContent=player.playing?'Pause':'Play';if(player.currentFrame!==lastFrame){lastFrame=player.currentFrame;overlay.clear();if($('regions').checked)for(const o of asset.manifest.frames[lastFrame].operations)overlay.rect(o.x,o.y,o.width,o.height).stroke({width:1,color:o.kind==='clear'?0xff7b84:0xb2f769});}}
async function load(){if(!files)return;try{status('Loading pages…');if(app){asset.destroy();app.destroy(true,{children:true});}lastFrame=-1;app=new PIXI.Application();await app.init({resizeTo:$('view'),preference:$('backend').value,backgroundAlpha:0,antialias:false,resolution:1,preferWebGLVersion:2});$('view').appendChild(app.canvas);asset=await AnimationMakerDelta.DeltaAtlasAsset.loadFiles(files);player=asset.createPlayer(app.renderer);overlay=new PIXI.Graphics();app.stage.addChild(player.sprite,overlay);app.renderer.on('resize',fit);player.loop=$('loop').checked;player.speed=Number($('speed').value);$('scrub').max=asset.manifest.frames.length-1;fit();refresh();app.ticker.add(t=>{player.update(t.deltaMS);refresh();});let reportFile=files.find(f=>f.name==='delta.report.json');if(reportFile){let r=JSON.parse(await reportFile.text());status(`${r.deltaBytes.toLocaleString()} bytes vs classic PNG ${r.classicBytes.toLocaleString()} bytes · ${r.savingsPercent.toFixed(1)}% smaller\n${r.verifiedFrames} frames verified · ${r.uniquePatches} unique patches · ${r.pages} pages\n${qualitySummary(r)} · ${(r.updatedPixelPercent ?? 0).toFixed(1)}% canvas updated/frame\nGPU atlas ${(r.atlasGpuBytes/1048576).toFixed(2)} MiB + ${(r.perPlayerGpuBytes/1048576).toFixed(2)} MiB/player\n${r.recommendation}`);}else status('Delta animation loaded');}catch(e){console.error(e);status(e.message);}}
$('folder').onchange=e=>{files=Array.from(e.target.files);load();};$('backend').onchange=load;
$('play').onclick=()=>{if(player){player.playing?player.pause():player.play();refresh();}};
$('scrub').oninput=e=>{if(player){player.gotoAndStop(Number(e.target.value));refresh();}};
$('previous').onclick=()=>{if(player){player.gotoAndStop(player.currentFrame-1);refresh();}};$('next').onclick=()=>{if(player){player.gotoAndStop(player.currentFrame+1);refresh();}};
$('loop').onchange=e=>{if(player)player.loop=e.target.checked;};$('speed').onchange=e=>{if(player)player.speed=Number(e.target.value);};
$('regions').onchange=()=>{lastFrame=-1;refresh();};$('background').onchange=e=>$('view').style.background=e.target.value==='checker'?'':e.target.value;
</script></html>
